<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wgth@800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Barlow', sans-serif;
      font-weight: 800;
      background-color: #2e2d2d;
      color: #ffffff;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .button-bar {
      display: flex;
      flex-wrap: wrap; /* Allow wrapping on small screens */
      background-color: #222222;
    }

    .button-bar button {
      flex: 1 1 25%; /* Allow buttons to shrink and wrap */
      min-width: 150px;
      max-width: 100%;
      padding: 12px;
      font-size: 20px;
      white-space: nowrap; /* Prevent text wrapping */
      border: none;
      background-color: #238EA9;
      color: #ffffff;
      cursor: pointer;
      transition: flex 0.2s ease, background-color 0.2s ease, color 0.2s ease;
      appearance: none;
      font-family: 'Barlow', sans-serif;
      font-weight: 800;
    }

    .button-bar button:hover {
      flex: 1.25;
      background-color: #ffffff !important;
      color: #000000 !important;
    }

    .content {
      flex: 1;
      padding: 20px;
      overflow: auto;
      font-family: 'Barlow', sans-serif;
      font-weight: 800;
    }

    /* 2x Bigger Switch */
    .switch {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 120px;
      height: 68px;
      background-color: #238EA9; /* Greek blue */
      border: 2px solid black;
      border-radius: 68px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      user-select: none;
      display: flex;
      align-items: center;
      padding: 4px;
      z-index: 9999;
    }

    .switch-toggle {
      width: 60px;
      height: 60px;
      background-color: white;
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
      transform: translateX(0);
    }

    .switch.active {
      background-color: #B22234; /* USA red */
    }

    .switch.active .switch-toggle {
      transform: translateX(52px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="button-bar">
      <button data-en="Our Team" data-gr="Η Ομαδα Μας">Our Team</button>
      <button data-en="Home" data-gr="Αρχικη Σεληδα">Home</button>
      <button data-en="Contact Us" data-gr="Επικηνονιστε μαζι μας">Contact Us</button>
      <button data-en="Why Choose Us" data-gr="Γιατι Να Μας Επιλεξετε?">Why Choose Us</button>
    </div>
    <div class="content">
      <p>Idfk anyMore nuggeT and i can fucking sweaR on A fucking dentist fuckiNg website lmfao cuz im fucking making thiS fucking shit im going insane</p>
    </div>
  </div>

  <!-- Language Toggle Switch -->
  <div class="switch" id="flag-switch" role="switch" aria-checked="false" tabindex="0" aria-label="Toggle Greek/American flag colors">
    <div class="switch-toggle"></div>
  </div>

  <script>
    const switchEl = document.getElementById('flag-switch');
    const buttons = document.querySelectorAll('.button-bar button');

    function updateButtonText(isAmerican) {
      buttons.forEach(btn => {
        btn.textContent = isAmerican ? btn.getAttribute('data-en') : btn.getAttribute('data-gr');
      });
    }

    switchEl.addEventListener('click', () => {
      const active = switchEl.classList.toggle('active');
      switchEl.setAttribute('aria-checked', active);
      updateButtonText(active);
    });

    switchEl.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        switchEl.click();
      }
    });

    // Set default to Greek
    updateButtonText(false);
  </script>
</body>
</html>
