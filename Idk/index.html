<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wgth@800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Barlow', sans-serif;
      font-weight: 800;
      background-color: #2e2d2d;
      color: #ffffff;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .button-bar {
      display: flex;
      background-color: #222222;
    }

    .button-bar button {
      flex: 1;
      padding: 15px;
      font-size: 25px;
      border: none;
      background-color: #238EA9;
      color: #ffffff; /* Changed from black to white */
      cursor: pointer;
      transition: flex 0.2s ease, background-color 0.2s ease, color 0.2s ease;
      appearance: none;
      font-family: 'Barlow', sans-serif;
      font-weight: 800;
    }

    .button-bar button:hover {
      flex: 1.25;
      background-color: #ffffff !important;
      color: #000000 !important; /* Black on hover */
    }

    .content {
      flex: 1;
      padding: 20px;
      overflow: auto;
      font-family: 'Barlow', sans-serif;
      font-weight: 800;
    }

    /* New styles for the flag toggle button */
    #flag-toggle {
      position: fixed;
      bottom: 20px; /* offset from bottom */
      right: 20px;  /* offset from right */
      padding: 10px 15px;
      font-size: 30px;
      border: none;
      background-color: #238EA9;
      color: white;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      transition: background-color 0.3s ease;
      user-select: none;
    }

    #flag-toggle:hover {
      background-color: #1a7080;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="button-bar">
      <button>Our Team</button>
      <button>Home</button>
      <button>Contact Us</button>
      <button>Why Choose Us?</button>
    </div>
    <div class="content">
      <p>Testin flags (im a dumbass)</p>
    </div>
  </div>

  <!-- Flag toggle button -->
  <button id="flag-toggle" aria-label="Toggle Flag">🇬🇷</button>

  <script>
    const flagBtn = document.getElementById('flag-toggle');
    let isGreek = true;

    flagBtn.addEventListener('click', () => {
      if (isGreek) {
        flagBtn.textContent = '🇺🇸';
      } else {
        flagBtn.textContent = '🇬🇷';
      }
      isGreek = !isGreek;
    });
  </script>
</body>
</html>
