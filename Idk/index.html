<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Button Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: sans-serif;
      background-color: #9cdaea; /* Main frame background */
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .button-bar {
      display: flex;
      background-color: #e0e0e0;
    }

    .button-bar button {
      flex: 1 1 0;
      padding: 15px;
      font-size: 18px;
      border: none;
      background-color: #9cdaea;
      color: #000000;
      cursor: pointer;
      transition: flex 0.2s ease, background-color 0.2s ease;
      -webkit-appearance: none;
         -moz-appearance: none;
              appearance: none;
    }

    /* Remove any focus outline */
    .button-bar button:focus {
      outline: none;
    }

    .button-bar button:hover {
      flex: 1.25 1 0;                  /* Grow to 125% */
      background-color: #ffffff !important; /* Force pure white */
      color: #000000 !important;      /* Ensure text stays black */
    }

    .content {
      flex: 1;
      background-color: #ffffff;
      padding: 20px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="button-bar">
      <button>Our Team</button>
      <button>Home</button>
      <button>Contact Us</button>
      <button>Why Choose Us</button>
    </div>
    <div class="content">
      <!-- Your scalable content goes here -->
    </div>
  </div>
</body>
</html>
