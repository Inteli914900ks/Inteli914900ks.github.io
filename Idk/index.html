<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Button Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: sans-serif;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #9cdaea; /* Main frame background */
    }

    .button-bar {
      display: flex;
      flex-shrink: 0;
      background-color: #e0e0e0;
      overflow: visible; /* Ensure overflow doesn't get cut off */
    }

    .button-bar button {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      border: none;
      background-color: #9cdaea;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
      position: relative; /* Required for z-index to work */
      z-index: 0;
    }

    .button-bar button:hover {
      background-color: white;
      transform: scale(1.25);
      z-index: 10; /* Brings it to front during hover */
    }

    .content {
      flex-grow: 1;
      background-color: white;
      padding: 20px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="button-bar">
      <button>Our Team</button>
      <button>Home</button>
      <button>Contact Us</button>
      <button>Why Choose Us</button>
    </div>
    <div class="content">
      <!-- Your scalable content goes here -->
    </div>
  </div>
</body>
</html>
