<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wgth@800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Barlow', sans-serif;
      font-weight: 800;
      background-color: #2e2d2d;
      color: #ffffff;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .button-bar {
      display: flex;
      background-color: #222222;
    }

    .button-bar button {
      flex: 1;
      padding: 15px;
      font-size: 25px;
      border: none;
      background-color: #238EA9;
      color: #ffffff; /* Changed from black to white */
      cursor: pointer;
      transition: flex 0.2s ease, background-color 0.2s ease, color 0.2s ease;
      appearance: none;
      font-family: 'Barlow', sans-serif;
      font-weight: 800;
    }

    .button-bar button:hover {
      flex: 1.25;
      background-color: #ffffff !important;
      color: #000000 !important; /* Black on hover */
    }

    .content {
      flex: 1;
      padding: 20px;
      overflow: auto;
      font-family: 'Barlow', sans-serif;
      font-weight: 800;
    }

    /* Switch container */
    .switch {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 34px;
      background-color: #238EA9; /* Greek blue */
      border: 2px solid black;
      border-radius: 34px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      user-select: none;
      display: flex;
      align-items: center;
      padding: 2px;
    }

    /* The toggle circle */
    .switch-toggle {
      width: 30px;
      height: 30px;
      background-color: white;
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
      /* Start on left */
      transform: translateX(0);
    }

    /* Active state */
    .switch.active {
      background-color: #B22234; /* USA red */
    }

    .switch.active .switch-toggle {
      transform: translateX(26px); /* Move right */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="button-bar">
      <button>Our Team</button>
      <button>Home</button>
      <button>Contact Us</button>
      <button>Why Choose Us</button>
    </div>
    <div class="content">
      <p>Random Shit I Dont Know Anymore</p>
    </div>
  </div>

  <!-- Switch -->
  <div class="switch" id="flag-switch" role="switch" aria-checked="false" tabindex="0" aria-label="Toggle Greek/American flag colors">
    <div class="switch-toggle"></div>
  </div>

  <script>
    const switchEl = document.getElementById('flag-switch');

    switchEl.addEventListener('click', () => {
      const active = switchEl.classList.toggle('active');
      switchEl.setAttribute('aria-checked', active);
    });

    // Allow toggle via keyboard (space and enter)
    switchEl.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        switchEl.click();
      }
    });
  </script>
</body>
</html>
