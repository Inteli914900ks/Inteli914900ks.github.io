<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Button Layout</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f2f2f2;
    }

    .container {
      width: 1000px;
      height: 500px;
      background-color: white;
      border: 1px solid #ccc;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }

    .button-bar {
      display: flex;
      background-color: #e0e0e0;
      padding: 10px;
      gap: 10px;
    }

    .button-bar button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .content {
      flex-grow: 1;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="button-bar">
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>4</button>
    </div>
    <div class="content">
      <!-- Your content here -->
    </div>
  </div>
</body>
</html>
