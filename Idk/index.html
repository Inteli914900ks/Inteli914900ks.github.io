<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Button Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .button-bar {
      display: flex;
      flex-shrink: 0;
      background-color: #e0e0e0;
    }

    .button-bar button {
      flex: 1; /* Make all buttons stretch evenly */
      padding: 15px;
      font-size: 18px;
      border: none;
      background-color: #d0d0d0;
      cursor: pointer;
    }

    .button-bar button:hover {
      background-color: #c0c0c0;
    }

    .content {
      flex-grow: 1;
      background-color: white;
      padding: 20px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="button-bar">
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>4</button>
    </div>
    <div class="content">
      <!-- Your scalable content goes here -->
    </div>
  </div>
</body>
</html>
