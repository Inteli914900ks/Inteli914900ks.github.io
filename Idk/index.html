<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Button Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: sans-serif;
      background-color: #000000; /* Black background */
      color: #ffffff; /* Optional: make text visible on black */
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .button-bar {
      display: flex;
      background-color: #222222;
    }

    .button-bar button {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      border: none;
      background-color: #9cdaea;
      color: #000;
      cursor: pointer;
      transition: flex 0.2s ease, background-color 0.2s ease;
      appearance: none;
    }

    .button-bar button:hover {
      flex: 1.25;
      background-color: #ffffff !important;
      color: #000000 !important;
    }

    .content {
      flex: 1;
      padding: 20px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="button-bar">
      <button>Our Team</button>
      <button>Home</button>
      <button>Contact Us</button>
      <button>Why Choose Us</button>
    </div>
    <div class="content">
      <!-- Your scalable content goes here -->
      <p>Hello, world!</p>
    </div>
  </div>
</body>
</html>
